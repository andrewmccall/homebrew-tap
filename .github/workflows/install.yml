name: Install published formula
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Formula/**']
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04
      - name: Install and test the public tap
        run: |
          # Source-only formulas are published before their bottles.
          if grep -q 'bottle do' Formula/sproozi.rb; then
            brew install --force-bottle andrewmccall/tap/sproozi
          else
            brew install andrewmccall/tap/sproozi
          fi
          brew test andrewmccall/tap/sproozi
          brew audit --strict andrewmccall/tap/sproozi
          sproozi --version
          sproozi --help
